name: Build Android APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Zip Project
        run: |
          UNZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d extracted_project
          else
            echo "No zip file found!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build Web Assets
        run: |
          cd extracted_project
          if [ -f "package.json" ]; then
            npm install
            npm run build || echo "No build script, skipping..."
          fi

      - name: Build APK with Gradle
        run: |
          cd extracted_project
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android directory not found inside zip!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: extracted_project/android/app/build/outputs/apk/debug/*.apk
          
