name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract, Setup & Build APK
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          # Move inside nested directory if zip extracted into a folder (ignoring node_modules)
          FIRST_DIR=$(ls -d */ 2>/dev/null | grep -v 'node_modules/' | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR"
          fi

          # Ensure package.json exists
          if [ ! -f "package.json" ]; then
            echo "Creating default package.json..."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --save
          fi

          echo "Installing dependencies..."
          npm install --legacy-peer-deps || npm install

          npm run build || echo "Skipping npm build..."

          # Ensure Android platform exists
          if [ ! -d "android" ]; then
            echo "Generating missing Android platform..."
            npx cap init MQL5EAStudio com.mql5.eastudio --web-dir www --yes || true
            npx cap add android || true
          fi

          npx cap sync android || true

          # Now build the APK directly here where android folder is guaranteed to exist
          if [ -d "android" ]; then
            cd android
            echo "Building APK with Gradle..."
            chmod +x gradlew || true
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Error: Android folder could not be created!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
            
