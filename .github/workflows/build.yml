name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract & Setup Project
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          # If nested inside a folder, move into it
          FIRST_DIR=$(ls -d */ 2>/dev/null | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR" || true
          fi

          # Ensure package.json exists
          if [ ! -f "package.json" ]; then
            echo "Creating default package.json..."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --save
          fi

          echo "Installing dependencies..."
          npm install --legacy-peer-deps || npm install

          npm run build || echo "Skipping npm build..."

          # Ensure Android platform exists
          if [ ! -d "android" ]; then
            echo "Generating missing Android platform..."
            npx cap init MQL5EAStudio com.mql5.eastudio --web-dir www --yes || true
            npx cap add android || true
          fi

          npx cap sync android || true
          
          # Copy everything to workspace root for gradle
          cd ..
          mkdir -p final_workspace
          cp -r app_source/* final_workspace/ 2>/dev/null || true
          # Handle if it was nested
          if [ -d "app_source/$FIRST_DIR" ]; then
            cp -r app_source/$FIRST_DIR* final_workspace/ 2>/dev/null || true
          fi

      - name: Build APK with Gradle
        run: |
          # Find where android folder is located
          ANDROID_PATH=$(find . -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_PATH" ]; then
            cd "$ANDROID_PATH"
            echo "Found android at $ANDROID_PATH"
            chmod +x gradlew || true
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Error: Android directory not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
            
