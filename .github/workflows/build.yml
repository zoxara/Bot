name: Auto-Fix & Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Auto-Detect, Extract & Setup Project
        run: |
          echo "Searching for zip file..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$UNZIP_FILE" ]; then
            echo "Found zip file: $UNZIP_FILE. Extracting..."
            mkdir -p extracted_project
            unzip -q "$UNZIP_FILE" -d extracted_project
          else
            echo "Error: No zip file found in root directory!"
            exit 1
          fi

          cd extracted_project
          
          # If nested inside another folder, fix path
          if [ -d "$(ls -d */ | head -n 1)android" ]; then
            cd $(ls -d */ | head -n 1)
          fi

          echo "Installing dependencies..."
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            
            # Check if Capacitor or Cordova is used, add android platform if missing
            if [ ! -d "android" ]; then
              echo "Android folder missing. Generating Android platform..."
              npx cap init --force || true
              npx cap add android || true
              npx ionic capacitor add android || true
            fi
          fi

      - name: Auto-Fix Gradle & Build APK
        run: |
          cd extracted_project
          # Find android folder dynamically anywhere inside extracted files
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          
          if [ -n "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR"
            echo "Found Android directory at: $ANDROID_DIR"
            
            # Sync web assets to android if capacitor config exists
            if [ -f "../../capacitor.config.json" ] || [ -f "../capacitor.config.ts" ]; then
              npx cap sync android || true
            fi

            chmod +x gradlew || chmod +x ./gradlew || true
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Error: Android folder could not be generated or located!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
