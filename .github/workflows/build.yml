name: Auto-Fix & Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Detect & Extract Zip Project
        run: |
          echo "Searching for zip file..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$UNZIP_FILE" ]; then
            echo "Found zip file: $UNZIP_FILE. Extracting..."
            mkdir -p extracted_project
            unzip -q "$UNZIP_FILE" -d extracted_project
          else
            echo "Error: No zip file found in root directory!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Auto-Fix & Install Dependencies
        run: |
          cd extracted_project
          # Check if android folder exists, if not initialize or handle missing parts
          if [ -f "package.json" ]; then
            echo "Installing Node modules..."
            npm install --legacy-peer-deps || npm install
            npm run build || echo "Build script not found or skipped."
          fi

      - name: Auto-Fix Gradle & Build APK
        run: |
          cd extracted_project
          # Locate android directory automatically
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR"
            echo "Found Android directory at: $ANDROID_DIR"
            
            # Auto-fix missing gradlew permissions and wrapper issues
            chmod +x gradlew || chmod +x ./gradlew
            
            # Clean and build debug APK with auto-fix flags
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Error: Android folder could not be located inside the extracted project!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
