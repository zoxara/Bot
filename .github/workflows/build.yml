name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Zip Project
        run: |
          # Nimage iroru zip file hesarannu ivide badalayisikolli (eg: mql5-ea-studio.zip)
          UNZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d extracted_project
            cd extracted_project
          else
            echo "No zip file found, looking for normal files..."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build
        run: |
          if [ -d "extracted_project" ]; then
            cd extracted_project
          fi
          npm install
          npm run build || npx cap sync

      - name: Build APK with Gradle
        run: |
          if [ -d "extracted_project/android" ]; then
            cd extracted_project/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "Android folder not found!"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            extracted_project/android/app/build/outputs/apk/debug/*.apk
            
